<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Oriel launch home page: one promise, one cited answer as proof, one action. Studio concept." preserveAspectRatio="xMidYMid slice" text-rendering="geometricPrecision"><rect x="0" y="0" width="640" height="400" fill="#0B0C0E"/><rect x="0" y="0" width="640" height="400" fill="#0B0C0E"/><text x="24" y="30" fill="#E6E9ED" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="-0.17" style="font-stretch:112%">Oriel</text><text x="104" y="29" fill="#8A919B" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12">Product</text><text x="168.14" y="29" fill="#8A919B" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12">Pricing</text><text x="227.16" y="29" fill="#8A919B" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12">Changelog</text><text x="307.41" y="29" fill="#8A919B" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12">Docs</text><rect x="504" y="11" width="112" height="26" rx="4" fill="#E6E9ED"/><text x="560" y="28.32" fill="#0B0C0E" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="560" text-anchor="middle">Request access</text><text x="488" y="28.5" fill="rgba(230,233,237,.72)" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12" text-anchor="end">Sign in</text><line x1="0" y1="47.5" x2="640" y2="47.5" stroke="rgba(230,233,237,.10)" stroke-width="1"/><text x="24" y="88" fill="#8A919B" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="560" letter-spacing="0.88">FOR EQUITY RESEARCH</text><text x="22" y="126" fill="#E6E9ED" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="-0.64" style="font-stretch:118%">Answers from</text><text x="22" y="162" fill="#E6E9ED" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="-0.64" style="font-stretch:118%">every filing, with</text><text x="22" y="198" fill="#E6E9ED" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="600" letter-spacing="-0.64" style="font-stretch:118%">the page cited.</text><text x="24" y="222" fill="#8A919B" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13">Oriel reads 10-Ks, 10-Qs and call</text><text x="24" y="241" fill="#8A919B" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13">transcripts, so your desk can ask in plain</text><text x="24" y="260" fill="#8A919B" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13">English and check every source in a click.</text><rect x="24" y="290" width="128" height="34" rx="4" fill="#E6E9ED"/><text x="88" y="311.5" fill="#0B0C0E" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="560" text-anchor="middle">Request access</text><text x="168" y="311.5" fill="#E6E9ED" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="560">See a sample answer</text><path d="M294.2125 307.5 L303.2125 307.5 M299.7125 304.0 L303.2125 307.5 L299.7125 311.0" fill="none" stroke="#E6E9ED" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="360" y="72" width="256" height="260" rx="8" fill="#181C22"/><rect x="360.5" y="72.5" width="255" height="259" rx="8" fill="none" stroke="rgba(230,233,237,.10)" stroke-width="1"/><text x="376" y="98" fill="#8A919B" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="560" letter-spacing="0.8">ASK</text><text x="376" y="120" fill="#E6E9ED" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="560">How did gross margin compare</text><text x="376" y="137" fill="#E6E9ED" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="560">with guidance last quarter?</text><line x1="376" y1="156.5" x2="600" y2="156.5" stroke="rgba(230,233,237,.10)" stroke-width="1"/><text x="376" y="176" fill="#8A919B" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="560" letter-spacing="0.8">ANSWER</text><text x="376" y="196" fill="rgba(230,233,237,.72)" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="11.5">Gross margin finished above the guided</text><text x="376" y="213" fill="rgba(230,233,237,.72)" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="11.5">range for a third straight quarter, helped</text><text x="376" y="230" fill="rgba(230,233,237,.72)" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="11.5">by mix. Management named freight as the</text><text x="376" y="247" fill="rgba(230,233,237,.72)" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="11.5">main risk to next quarter.</text><rect x="506.37" y="237.5" width="12" height="12" rx="2" fill="none" stroke="#8A919B" stroke-width="1"/><text x="512.37" y="246.8" fill="rgba(230,233,237,.72)" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle">1</text><rect x="523.37" y="237.5" width="12" height="12" rx="2" fill="none" stroke="#8A919B" stroke-width="1"/><text x="529.37" y="246.8" fill="rgba(230,233,237,.72)" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle">2</text><line x1="376" y1="256.5" x2="600" y2="256.5" stroke="rgba(230,233,237,.10)" stroke-width="1"/><rect x="376.5" y="268.5" width="12" height="12" rx="2" fill="none" stroke="#8A919B" stroke-width="1"/><text x="382.5" y="277.8" fill="rgba(230,233,237,.72)" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600" text-anchor="middle">1</text><path d="M396 268 H403 L406 271 V281 H396 Z" fill="n