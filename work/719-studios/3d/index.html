<style>

  .hud { font: 11px/1.3 var(--font-hud, monospace); letter-spacing: .08em; text-transform: uppercase; }
  .bar { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px;
         padding: calc(env(safe-area-inset-top) + 14px) 16px 14px; pointer-events: none; }

  .switch button[aria-pressed="true"] { color: var(--void); background: var(--chrome); }
  .hint { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 16px); text-align: center; color: var(--chrome-3); pointer-events: none; transition: opacity .6s; }
  .marker { position: fixed; left: 0; top: 0; translate: -50% -50%; display: flex; align-items: center; gap: 8px; cursor: pointer;
            background: none; border: 0; padding: 10px; color: var(--chrome); }
  .marker i { width: 14px; height: 14px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 0 rgba(255,91,53,.6); animation: pulse 2.4s infinite; flex: none; }
  .marker span { background: rgba(11,12,14,.78); padding: 5px 8px; border: 1px solid var(--line); white-space: nowrap; }

  .load { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; color: #464642; transition: opacity .5s; }
  .load .track { width: 180px; height: 2px; background: var(--line); }
  .load .fill { height: 100%; width: 0; background: var(--signal); transition: width .2s; }
  .sheet { position: fixed; inset: 0; background: rgba(11,12,14,.92); backdrop-filter: blur(10px); display: grid; grid-template-rows: auto 1fr auto; opacity: 0; pointer-events: none; transition: opacity .35s; }
  .sheet.open { opacity: 1; pointer-events: auto; }
  .sheet header { display: flex; justify-content: space-between; align-items: center; padding: calc(env(safe-area-inset-top) + 14px) 16px 12px; }
  .sheet header button { all: unset; cursor: pointer; min-height: 40px; min-width: 40px; display: grid; place-items: center; border: 1px solid var(--line); }
  .track-imgs { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 16px; align-items: center; scrollbar-width: none; overscroll-behavior-x: contain; }
  .track-imgs::-webkit-scrollbar { display: none; }
  .track-imgs figure { flex: none; margin: 0; scroll-snap-align: center; display: grid; gap: 8px; }
  .track-imgs::before, .track-imgs::after { content: ''; flex: none; width: max(0px, calc(50vw - 19dvh - 28px)); }   /* end spacers: any item, even a narrow portrait clip, can sit centred */
  .track-imgs img, .track-imgs video { display: block; height: min(66dvh, 120vw); max-width: 92vw; width: auto; object-fit: cover; background: #15171a; }
  .track-imgs figcaption a { color: var(--chrome-3); text-decoration: none; text-transform: none; display: inline-block; padding: 6px 0; }
  .track-imgs figcaption a:hover, .track-imgs figcaption a:focus-visible { color: var(--chrome); }
  .sheet footer { display: flex; justify-content: center; gap: 6px; padding: 14px 16px calc(env(safe-area-inset-bottom) + 18px); }
  .sheet footer i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }

  .pick { position: fixed; left: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); max-width: calc(100vw - 24px); background: rgba(11,12,14,.86); border: 1px solid var(--signal); padding: 8px 10px; pointer-events: none; overflow-wrap: anywhere; }

  button { font: inherit; }
  button:focus-visible { outline: 2px solid var(--signal); outline-offset: 4px; }
  button:disabled { opacity: .35; cursor: default; }
  [hidden] { display: none !important; }
  .explore-controls { position:fixed; left:24px; bottom:24px; display:flex; gap:8px; }
  .explore-controls button,.tour-actions button,.comparison>button,.panel-top button,.sheet footer button { border:1px solid var(--line); background:rgba(20,22,24,.9); color:var(--chrome); padding:11px 15px; cursor:pointer; border-radius:3px; min-height:44px; }
  .explore-controls button:first-child { background:var(--chrome); color:var(--void); }
  .explore-controls span { margin-left:20px; }
  /* bottom right: the overview button, always on screen */
  .corner { position:fixed; right:24px; bottom:24px; display:flex; align-items:flex-end; gap:12px; }
  .corner .fit { width:44px; height:44px; display:grid; place-items:center; border:1px solid var(--line); background:rgba(20,22,24,.9); color:var(--chrome); border-radius:3px; cursor:pointer; padding:0; }
  .corner .fit svg { fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:square; }
  /* The tour (JC 2026-10-18): each chapter is a short, media-heavy article that scrolls inside the panel: big title, a
     wide lead image, the story with photos and carousels through it. Back / Next stay pinned under a fade.
     Phones: a drawer that opens at half the screen and drags to any height. */
  .tour-panel { position:fixed; left:24px; bottom:84px; width:min(460px,calc(100vw - 80px)); max-height:calc(100dvh - 230px); display:flex; flex-direction:column; padding:14px 20px 16px; background:rgba(15,17,19,.95); border:1px solid var(--line); backdrop-filter:blur(12px); border-radius:6px; }
  .panel-top { flex:none; display:flex; justify-content:space-between; align-items:center; color:var(--chrome-3); }
  .panel-top button { padding:4px 12px; border:0; background:none; }
  .chapters { flex:none; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin:10px -20px 8px; padding:0 20px; scroll-padding:0 20px; }
  .chapters::-webkit-scrollbar { display:none; }
  .chapters button { all:unset; flex:none; cursor:pointer; font:400 11px/1 var(--font-hud,'Departure Mono',monospace); letter-spacing:.08em; text-transform:uppercase; color:var(--chrome-3); border:1px solid var(--line); border-radius:3px; padding:9px 10px; }
  .chapters button[aria-selected="true"] { color:var(--void); background:var(--chrome); border-color:var(--chrome); }
  .chapters button:focus-visible { outline:2px solid var(--signal); outline-offset:2px; }
  .sheet-grip, .tour-ticks { display:none; }
  .tour-article { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; margin:0 -20px; padding:4px 20px 30px; scrollbar-width:thin; }
  .tour-article h1 { font-size:36px; font-weight:400; line-height:1.05; letter-spacing:-.03em; margin:4px 0 14px; }
  .tour-article p { color:#d0d4da; font-size:17px; line-height:1.5; margin:0 0 16px; }   /* JC 2026-10-19: the story read small; 17 / 16 px, brighter */
  .tour-article .art-dek { color:var(--chrome); font-size:20px; line-height:1.35; }
  .art-media { all:unset; display:block; position:relative; width:100%; cursor:pointer; border-radius:4px; overflow:hidden; background:#15171a; margin:0 0 14px; box-sizing:border-box; }
  .art-media img { display:block; width:100%; height:100%; object-fit:cover; transition:transform .4s; }
  .art-media:hover img, .art-media:focus-visible img { transform:scale(1.03); }
  .art-media:focus-visible { outline:2px solid var(--signal); outline-offset:2px; }
  .art-lead { aspect-ratio:3/2; }
  .art-wide { aspect-ratio:4/3; }
  .art-carousel { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -20px 6px; padding:0 20px; scroll-padding:0 20px; scrollbar-width:none; overscroll-behavior-x:contain; }
  .art-carousel::-webkit-scrollbar { display:none; }
  .art-carousel .art-media { flex:none; width:70%; aspect-ratio:4/5; scroll-snap-align:start; margin:0; }
  .tour-article .art-count { font:400 11px/1 var(--font-hud,'Departure Mono',monospace); letter-spacing:.08em; text-transform:uppercase; color:var(--chrome-3); margin:0 0 18px; }
  .art-media .play { position:absolute; inset:0; margin:auto; width:44px; height:44px; border-radius:50%; background:rgba(11,12,14,.72); }
  .art-media .play::after { content:''; position:absolute; left:17px; top:13px; border-style:solid; border-width:9px 0 9px 14px; border-color:transparent transparent transparent #fff; }
  .art-media .expand { position:absolute; right:8px; bottom:8px; display:flex; align-items:center; gap:5px; padding:6px 7px; border-radius:3px; background:rgba(11,12,14,.78); color:#fff; font-size:11px; line-height:1; }
  .art-media .expand svg { fill:none; stroke:currentColor; stroke-width:1.6; }
  .tour-actions { flex:none; position:relative; display:flex; gap:6px; padding-top:10px; }
  .tour-actions::before { content:''; position:absolute; left:-20px; right:-20px; bottom:100%; height:44px; background:linear-gradient(rgba(15,17,19,0),rgba(15,17,19,.95)); pointer-events:none; }
  .tour-actions button:last-child { flex:1; }
  #photo-layer { position:fixed; inset:0; background:rgba(11,12,14,.96); display:grid; place-items:center; }
  #photo-layer img { max-width:94vw; max-height:calc(100dvh - 180px); object-fit:contain; }
  .comparison { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:14px 18px; background:rgba(15,17,19,.96); border:1px solid var(--line); display:flex; gap:24px; align-items:center; border-radius:5px; max-width:calc(100vw - 64px); }
  .comparison p { font-size:12px; color:var(--chrome-3); margin:4px 0 0; white-space:nowrap; }

  .sheet footer { align-items:center; flex-wrap:wrap; gap:12px; }
  #dots { display:flex; gap:6px; }
  .track-imgs { position:relative; }
  .track-imgs img, .track-imgs video { object-fit:contain; }
  .hint { bottom:28px; color:#41433f; }

<script type="module">

// Three composed presets share the same environment and shadow map.
const LIGHTING = {
  day: { hemi:.65, sun:2.5, lamp:.45, glow:1.4, env:.48, exp:1.0, color:'#fff1df', sky:'#dbe9ef', ground:'#8a7865', pos:B(-4,9,10), window:'#ffffff', backdrop:['#afc4ce','#e3e4dc','#b7b9ae'] },
  golden: { hemi:.4, sun:3.3, lamp:.7, glow:1.8, env:.3, exp:1.02, color:'#ffb96c', sky:'#ead7c0', ground:'#715140', pos:B(-8,8,4), window:'#ffd6ad', backdrop:['#b58978','#ecd0ac','#a98970'] },
  night: { hemi:.32, sun:.35, lamp:1, glow:2.6, env:.28, exp:1.05, color:'#cad9f1', sky:'#bac9e0', ground:'#6d5548', pos:B(-4,9,10), window:'#45566e', backdrop:['#46505f','#87919c','#4b5361'] },
};

  tween={ to, from:{hemi:hemi.intensity,sun:sun.intensity,lamp:(lamps.children[0]?.intensity??0)/(lamps.children[0]?.userData.power||1),glow:glowMats[0]?.emissiveIntensity??0,env:scene.environmentIntensity,exp:renderer.toneMappingExposure},
    backdrop:scene.background?.userData.colors.map(c=>c.clone()),backdropTo:to.backdrop.map(c=>new THREE.Color(c)),
    color:sun.color.clone(),sky:hemi.color.clone(),ground:hemi.groundColor.clone(),pos:sun.position.clone(),window:windowMaterial.color.clone(),t0:performance.now(),dur:instant||reduce?0:900 };
  invalidate();
}
function applyTween(now) {

  glowMats.forEach(m=>m.emissiveIntensity=v('glow')*(m.userData.practicalStrength??.35)*(mode==='day'&&m.userData.nightOnly?0:1));scene.environmentIntensity=v('env');renderer.toneMappingExposure=v('exp');
  sun.color.copy(a.color).lerp(new THREE.Color(a.to.color),e);hemi.color.copy(a.sky).lerp(new THREE.Color(a.to.sky),e);hemi.groundColor.copy(a.ground).lerp(new THREE.Color(a.to.ground),e);
  sun.position.lerpVectors(a.pos,a.to.pos,e);windowMaterial.color.copy(a.window).lerp(new THREE.Color(a.to.window),e);
  if(scene.background && a.backdrop){
    const colors=scene.background.userData.colors;
    colors.forEach((c,i)=>c.lerpColors(a.backdrop[i],a.backdropTo[i],e));

document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));

// markers + carousel
let manifest = {}, instagram = {};
const getJSON = (f) => fetch(ASSETS + 'img/work/719/sets/' + f).then((r) => (r.ok ? r.json() : {})).catch(() => ({}));
const manifestReady = Promise.all([
  getJSON('manifest.json').then((m) => { manifest = m; }),
  getJSON('instagram.json').then((m) => { instagram = m; }),
]);
const storyPhotos = {};   // the tour's own photo lists (experience.js), shown in the same full-screen gallery
const setPhotos = (id) => [...(manifest[id] || []), ...(instagram[id] || [])];
const photos = (id) => storyPhotos[id] || (id === 'forest' ? [...setPhotos('green-wall'), ...setPhotos('pool')] : setPhotos(id));   // studio marketing photos, then Instagram picks with credits
const mk = document.getElementById('markers');
async function buildMarkers() {
  await manifestReady;
  SETS.filter((s) => photos(s.id).length).forEach((s) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'marker'; b.hidden = true;
    b.innerHTML = `<i aria-hidden="true"></i><span class="hud">${s.label}</span>`; b.setAttribute('aria-label', `Show photos of ${s.label}`);
    b.addEventListener('click', () => openSet(s)); mk.appendChild(b); s.el = b;
  });

    const b = document.createElement('button'); b.type = 'button'; b.className = 'marker'; b.hidden = true;
    b.innerHTML = `<i aria-hidden="true"></i><span class="hud">${office.label}</span>`; b.setAttribute('aria-label', 'Lift the office roof'); b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => liftOffice(!office.up)); mk.appendChild(b); office.el = b;
  }
}
function liftOffice(up) {
  office.up = up; office.el.setAttribute('aria-pressed', up); office.el.setAttribute('aria-label', up ? 'Lower the office roof' : 'Lift the office roof');
  invalidate(1300);
  office.anim = { from: office.k, to: up ? 1 : 0, t0: performance.now(), dur: reduce ? 0 : 1100 };
}
function applyLift(now) {

const sheet = document.getElementById('sheet'), imgs = document.getElementById('imgs'), dots = document.getElementById('dots');

function updateGallery() {
  const list=photos(currentSet?.id);const kids=[...imgs.children];if(!kids.length)return;
  const mid=imgs.scrollLeft+imgs.clientWidth/2;
  let best=0,bd=Infinity;kids.forEach((k,i)=>{const d=Math.abs(k.offsetLeft+k.clientWidth/2-mid);if(d<bd){bd=d;best=i;}});
  photoIndex=best;document.getElementById('photo-count').textContent=`${best+1} / ${list.length}`;

}
function openSet(s, start=0) {
  const list=photos(s.id);if(!list.length)return;
  currentSet=s;photoIndex=start;returnFocus=document.activeElement;
  document.getElementById('explore-photo').hidden=!!storyPhotos[s.id];   // story photos have no matching viewpoint
  document.getElementById('sheet-title').textContent=s.label;
  imgs.innerHTML=list.map((p,i)=>{
    const media=p.video
      ? `<video src="${ASSETS}img/work/719/sets/${p.video}" poster="${ASSETS}img/work/719/sets/${p.src}" width="${p.w}" height="${p.h}" controls playsinline muted loop preload="none" aria-label="${s.label}, video ${i+1}"></video>`
      : `<img src="${ASSETS}img/work/719/sets/${p.src}"${p.srcset?` srcset="${p.srcset.replace(/(^|, )/g,`$1${ASSETS}img/work/719/sets/`)}" sizes="100vw"`:''} width="${p.w}" height="${p.h}" alt="${p.alt||`${s.label}, photo ${i+1}`}" ${i>1?'loading="lazy"':''} decoding="async">`;

}

  sheet.classList.remove('open');imgs.querySelectorAll('video').forEach(v=>v.pause());[...document.body.children].forEach(el=>{if(el!==sheet)el.inert=false;});sheet.inert=true;if(restore&&returnFocus?.isConnected)returnFocus.focus();invalidate();
}
function stepPhoto(direction) {
  const child=imgs.children[Math.max(0,Math.min(imgs.children.length-1,photoIndex+direction))];
  if(child)imgs.scrollTo({left:child.offsetLeft-(imgs.clientWidth-child.clientWidth)/2,behavior:reduce?'instant':'smooth'});
}
imgs.addEventListener('scroll',updateGallery,{passive:true});
document.getElementById('gallery-prev').addEventListener('click',()=>stepPhoto(-1));
document.getElementById('gallery-next').addEventListener('click',()=>stepPhoto(1));
document.getElementById('close').addEventListener('click',()=>close());
sheet.addEventListener('click',e=>{if(e.target===sheet||e.target===imgs)close();});
const experience=createExperience({camera,controls,reduce,phone,openGallery:openSet,closeGallery:close,photos,storyPhotos,assetRoot:ASSETS,invalidate});

addEventListener('keydown',e=>{
  if(e.key==='Escape'){close();return;}

  if(e.key==='Tab'){
    const elements=[...sheet.querySelectorAll('button:not(:disabled),a[href]')];const first=elements[0],last=elements.at(-1);

  }

// pick: tap or click any part of the model to see its name (outlined in orange); tap empty space to clear
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), pickEl = document.getElementById('pick'); let pickBox = null, down = null;
function pickAt(cx, cy) {

}
window.__v.pickAt = pickAt;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', (e) => {
  if (new URLSearchParams(location.search).has('debug') && down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 400) pickAt(e.clientX, e.clientY);
  down = null;
});

// first touch hides the hint
canvas.addEventListener('pointerdown', () => { const h = document.getElementById('hint'); if (h) h.style.opacity = 0; }, { once: true });

let fitted = false;
// finishing effects (post.js): opt-in with ?post for now. The pipeline tone-maps the sky and window backdrops that are
// meant to skip tone mapping, which washes them out (JC 2026-10-17: "looks fucked"); off until that is solved.
const post = cover || !new URLSearchParams(location.search).has('post') ? null : createPost(renderer, scene, camera, { phone });
window.__v.post = post;
function resize() {
  const w = innerWidth, h = innerHeight;
  if (!w || !h) return;   // a page opened hidden (zero-size frame) would fit the camera to NaN for good; wait for a real size
  renderer.setSize(w, h, false); camera.aspect = w / h; post?.setSize(w, h);
  if (cover) camera.setViewOffset(w, h, 0, -h * 0.13, w, h);   // the loft sits low, under the cover's big name
  camera.updateProjectionMatrix();
  if (!fitted) {   // start far enough back that the whole loft (about 14 m with the slab) fits the screen's width
    fitted = true;
    const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect);
    const need = 7.4 / Math.tan(hfov / 2) * (cover ? 1.55 : 1), dir = camera.position.clone().sub(controls.target);
    controls.maxDistance = Math.max(controls.maxDistance, need * 1.15);
    if (dir.length() < need) camera.position.copy(controls.target).add(dir.setLength(need));
  }
}
addEventListener('resize', () => { resize(); invalidate(); }); resize();

const v = new THREE.Vector3(), toCam = new THREE.Vector3();
function frame(now) {
  controls.update(); experience.update(now); applyTween(now); applyLift(now);
  toCam.copy(camera.position).sub(controls.target).setY(0).normalize();
  walls.forEach((w) => {
    const visible = w.n.dot(toCam) < 0.25;
    w.castsShadow ??= w.o.castShadow;
    if (w.o.visible !== visible) { renderer.shadowMap.needsUpdate = true; sun.shadow.needsUpdate = true; }
    w.o.visible = visible;
    w.o.castShadow = visible && w.castsShadow;
  });
  lamps.children.forEach((light) => {
    let visible=true;
    for(let o=light.userData.fixture;o;o=o.parent) { if(!o.visible){visible=false;break;} }
    light.visible=visible;
  });
  for (const s of [...SETS, office]) {
    if (!s.el) continue;
    v.copy(s.at).project(camera);
    const vis = !experience.photoMode && !experience.animating && !sheet.classList.contains('open') && v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05;
    s.el.hidden = !vis;
    if (!vis) continue;
    const hw = (s.hw ||= s.el.offsetWidth / 2);   // keep the whole label on screen at phone width
    s.el.style.transform = `translate(${Math.min(Math.max((v.x + 1) / 2 * innerWidth, hw), innerWidth - hw)}px, ${(1 - v.y) / 2 * innerHeight}px)`;
  }
  if (post) post.render(); else renderer.render(scene, camera);
}
// Keep OrbitControls responsive, but stop drawing a static scene and while photos cover it.
renderer.setAnimationLoop((now) => {
  if(document.hidden)return;
  if(sheet.classList.contains('open')||experience.photoMode)return;
  if(now<renderUntil||tween||office.anim||experience.animating||(cover&&coverSeen&&!reduce))frame(now);
});
addEventListener('visibilitychange',()=>{if(!document.hidden)invalidate();});
invalidate();
window.__v.frame = () => frame(performance.now() + 1e5);   // debug: draw one settled frame
</script>
</body>
</html>
