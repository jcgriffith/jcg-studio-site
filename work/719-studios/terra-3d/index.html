<style>
  :root { --void: #0B0C0E; --chrome: #E6E9ED; --chrome-3: #8A919B; --line: rgba(230,233,237,.16); --signal: #FF5B35; color-scheme: dark; }

  canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; }
  /* cover = a backdrop inside another page (hero, Work-floor card): it must never take a touch. iOS/iPadOS WebKit lets a touch-action:none canvas inside an iframe swallow the swipe even when the iframe has pointer-events:none, so the cover itself says pan-y + no hit-testing (!important beats the inline touch-action OrbitControls sets) */
  html.is-cover, html.is-cover body, html.is-cover canvas { touch-action: pan-y !important; pointer-events: none !important; -webkit-user-select: none; user-select: none; }
  .hud { font: 11px/1.3 var(--font-hud, monospace); letter-spacing: .08em; text-transform: uppercase; }

  .switch { display: inline-flex; border: 1px solid var(--line); background: rgba(11,12,14,.72); backdrop-filter: blur(8px); }
  .switch button { all: unset; cursor: pointer; white-space: nowrap; padding: 0 14px; min-height: 40px; display: inline-flex; align-items: center; color: var(--chrome-3); }
  .switch button[aria-pressed="true"] { color: var(--void); background: var(--chrome); }
  .hint { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 16px); text-align: center; color: var(--chrome-3); pointer-events: none; transition: opacity .6s; }
  .marker { position: fixed; left: 0; top: 0; translate: -50% -50%; display: flex; align-items: center; gap: 8px; cursor: pointer;
            background: none; border: 0; padding: 10px; color: var(--chrome); }
  .marker i { width: 14px; height: 14px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 0 rgba(255,91,53,.6); animation: pulse 2.4s infinite; flex: none; }
  .marker span { background: rgba(11,12,14,.78); padding: 5px 8px; border: 1px solid var(--line); white-space: nowrap; }
  .marker[hidden] { display: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,91,53,.55); } 70% { box-shadow: 0 0 0 14px rgba(255,91,53,0); } 100% { box-shadow: 0 0 0 0 rgba(255,91,53,0); } }

  .load .track { width: 180px; height: 2px; background: var(--line); }
  .load .fill { height: 100%; width: 0; background: var(--signal); transition: width .2s; }
  .sheet { position: fixed; inset: 0; background: rgba(11,12,14,.92); backdrop-filter: blur(10px); display: grid; grid-template-rows: auto 1fr auto; opacity: 0; pointer-events: none; transition: opacity .35s; }
  .sheet.open { opacity: 1; pointer-events: auto; }
  .sheet header { display: flex; justify-content: space-between; align-items: center; padding: calc(env(safe-area-inset-top) + 14px) 16px 12px; }
  .sheet header button { all: unset; cursor: pointer; min-height: 40px; min-width: 40px; display: grid; place-items: center; border: 1px solid var(--line); }
  .track-imgs { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 16px; align-items: center; scrollbar-width: none; overscroll-behavior-x: contain; }
  .track-imgs::-webkit-scrollbar { display: none; }
  .track-imgs figure { flex: none; margin: 0; scroll-snap-align: center; display: grid; gap: 8px; }
  .track-imgs::before, .track-imgs::after { content: ''; flex: none; width: max(0px, calc(50vw - 19dvh - 28px)); }   /* end spacers: any item, even a narrow portrait clip, can sit centred */
  .track-imgs img, .track-imgs video { display: block; height: min(66dvh, 120vw); max-width: 92vw; width: auto; object-fit: cover; background: #15171a; }
  .track-imgs figcaption a { color: var(--chrome-3); text-decoration: none; text-transform: none; display: inline-block; padding: 6px 0; }

  @media (prefers-reduced-motion: reduce) { .marker i { animation: none; } }

  button { font: inherit; }
  button:focus-visible { outline: 2px solid var(--signal); outline-offset: 4px; }
  button:disabled { opacity: .35; cursor: default; }
  [hidden] { display: none !important; }
  .explore-controls { position:fixed; left:24px; bottom:24px; display:flex; gap:8px; }
  .explore-controls button,.tour-actions button,.comparison>button,.panel-top button,.sheet footer button { border:1px solid var(--line); background:rgba(20,22,24,.9); color:var(--chrome); padding:11px 15px; cursor:pointer; border-radius:3px; min-height:44px; }
  .explore-controls button:first-child { background:var(--chrome); color:var(--void); }
  .explore-controls span { margin-left:20px; }
  /* bottom right: the overview button, always on screen */
  .corner { position:fixed; right:24px; bottom:24px; display:flex; align-items:flex-end; gap:12px; }
  .corner .fit { width:44px; height:44px; display:grid; place-items:center; border:1px solid var(--line); background:rgba(20,22,24,.9); color:var(--chrome); border-radius:3px; cursor:pointer; padding:0; }
  .corner .fit svg { fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:square; }
  /* The tour (JC 2026-10-18): each chapter is a short, media-heavy article that scrolls inside the panel: big title, a
     wide lead image, the story with photos and carousels through it. Back / Next stay pinned under a fade.
     Phones: a drawer that opens at half the screen and drags to any height. */
  .tour-panel { position:fixed; left:24px; bottom:84px; width:min(400px,calc(100vw - 80px)); max-height:calc(100dvh - 230px); display:flex; flex-direction:column; padding:14px 20px 16px; background:rgba(15,17,19,.95); border:1px solid var(--line); backdrop-filter:blur(12px); border-radius:6px; }
  .panel-top { flex:none; display:flex; justify-content:space-between; align-items:center; color:var(--chrome-3); }
  .panel-top button { padding:4px 12px; border:0; background:none; }
  .chapters { flex:none; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin:10px -20px 8px; padding:0 20px; scroll-padding:0 20px; }
  .chapters::-webkit-scrollbar { display:none; }
  .chapters button { all:unset; flex:none; cursor:pointer; font:400 11px/1 var(--font-hud,'Departure Mono',monospace); letter-spacing:.08em; text-transform:uppercase; color:var(--chrome-3); border:1px solid var(--line); border-radius:3px; padding:9px 10px; }
  .chapters button[aria-selected="true"] { color:var(--void); background:var(--chrome); border-color:var(--chrome); }
  .chapters button:focus-visible { outline:2px solid var(--signal); outline-offset:2px; }
  .sheet-grip, .tour-ticks { display:none; }
  .tour-article { flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; margin:0 -20px; padding:4px 20px 30px; scrollbar-width:thin; }
  .tour-article h1 { font-size:30px; font-weight:400; line-height:1.05; letter-spacing:-.03em; margin:4px 0 14px; }
  .tour-article p { color:#b8bdc5; font-size:14px; line-height:1.5; margin:0 0 14px; }
  .tour-article .art-dek { color:var(--chrome); font-size:16px; line-height:1.38; }
  .art-media { all:unset; display:block; position:relative; width:100%; cursor:pointer; border-radius:4px; overflow:hidden; background:#15171a; margin:0 0 14px; box-sizing:border-box; }
  .art-media img { display:block; width:100%; height:100%; object-fit:cover; transition:transform .4s; }
  .art-media:hover img, .art-media:focus-visible img { transform:scale(1.03); }
  .art-media:focus-visible { outline:2px solid var(--signal); outline-offset:2px; }
  .art-lead { aspect-ratio:3/2; }
  .art-wide { aspect-ratio:4/3; }
  .art-carousel { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -20px 6px; padding:0 20px; scroll-padding:0 20px; scrollbar-width:none; overscroll-behavior-x:contain; }
  .art-carousel::-webkit-scrollbar { display:none; }
  .art-carousel .art-media { flex:none; width:70%; aspect-ratio:4/5; scroll-snap-align:start; margin:0; }
  .tour-article .art-count { font:400 11px/1 var(--font-hud,'Departure Mono',monospace); letter-spacing:.08em; text-transform:uppercase; color:var(--chrome-3); margin:0 0 18px; }
  .art-media .play { position:absolute; inset:0; margin:auto; width:44px; height:44px; border-radius:50%; background:rgba(11,12,14,.72); }
  .art-media .play::after { content:''; position:absolute; left:17px; top:13px; border-style:solid; border-width:9px 0 9px 14px; border-color:transparent transparent transparent #fff; }
  .art-media .expand { position:absolute; right:8px; bottom:8px; display:flex; align-items:center; gap:5px; padding:6px 7px; border-radius:3px; background:rgba(11,12,14,.78); color:#fff; font-size:11px; line-height:1; }
  .art-media .expand svg { fill:none; stroke:currentColor; stroke-width:1.6; }
  .tour-actions { flex:none; position:relative; display:flex; gap:6px; padding-top:10px; }

  .tour-actions button:last-child { flex:1; }
  #photo-layer { position:fixed; inset:0; background:rgba(11,12,14,.96); display:grid; place-items:center; }

  .comparison { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:14px 18px; background:rgba(15,17,19,.96); border:1px solid var(--line); display:flex; gap:24px; align-items:center; border-radius:5px; max-width:calc(100vw - 64px); }
