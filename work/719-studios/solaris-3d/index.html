<style>
  :root { --void: #0B0C0E; --chrome: #E6E9ED; --chrome-3: #8A919B; --line: rgba(230,233,237,.16); --signal: #FF5B35; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #c8c4bd; color: var(--chrome); overflow: hidden; }
  body { font: 15px/1.45 var(--font-sans, Arial, sans-serif); -webkit-tap-highlight-color: transparent; }

  .hud { font: 11px/1.3 var(--font-hud, monospace); letter-spacing: .08em; text-transform: uppercase; }
  .bar { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px;
         padding: calc(env(safe-area-inset-top) + 14px) 16px 14px; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .title { color: #464642; }
  .title b { color: #252724; font-weight: 400; }
  @media (max-width: 520px) { .title .more { display: none; } }
  .switch { display: inline-flex; border: 1px solid var(--line); background: rgba(11,12,14,.72); backdrop-filter: blur(8px); }
  .switch button { all: unset; cursor: pointer; white-space: nowrap; padding: 0 14px; min-height: 40px; display: inline-flex; align-items: center; color: var(--chrome-3); }
  .switch button[aria-pressed="true"] { color: var(--void); background: var(--chrome); }
  .hint { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 16px); text-align: center; color: var(--chrome-3); pointer-events: none; transition: opacity .6s; }
  .load { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center; color: #464642; transition: opacity .5s; }
  .load .track { width: 180px; height: 2px; background: var(--line); }
  .load .fill { height: 100%; width: 0; background: var(--signal); transition: width .2s; }
  button { font: inherit; }
  button:focus-visible { outline: 2px solid var(--signal); outline-offset: 4px; }
  button:disabled { opacity: .35; cursor: default; }
  [hidden] { display: none !important; }
  /* bottom right: the overview button, always on screen */
  .corner { position:fixed; right:24px; bottom:24px; display:flex; align-items:flex-end; gap:12px; }
  .corner .fit { width:44px; height:44px; display:grid; place-items:center; border:1px solid var(--line); background:rgba(20,22,24,.9); color:var(--chrome); border-radius:3px; cursor:pointer; padding:0; }
  .corner .fit svg { fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:square; }
  @media(max-width:760px) {
    .bar { align-items:flex-start; flex-direction:column; gap:10px; padding:14px; }
    .bar .switch { align-self:flex-end; }
    .bar .switch button { font-size:10px; padding:0 11px; }
    .corner { right:14px; bottom:calc(env(safe-area-inset-bottom) + 16px); gap:8px; }
    .hint { display:none; }
  }
  .title,.title b,.hint { transition:color .9s; }
  .studio-world .title,.studio-world .title b,.studio-world .hint { color:#f0eee8; }
  @media(prefers-reduced-motion:reduce) { .title,.title b,.hint { transition:none; } }
  .is-cover, .is-cover body { background: transparent; }
  .is-cover .bar, .is-cover .hint, .is-cover #load, .is-cover #markers, .is-cover .explore-controls, .is-cover .corner, .is-cover .pick { display: none !important; }
  body::after { content:none; }
  .hud-brand .hud-back { display:inline-grid; place-items:center; align-self:stretch; min-width:44px; border-right:1px solid var(--line); color:var(--chrome-2); font:400 15px/1 var(--font-hud); transition:color var(--dur-1) linear, background var(--dur-1) linear; }
  .hud-brand .hud-back:hover, .hud-brand .hud-back:focus-visible { color:var(--chrome); background:var(--void-3); }
  .bar { padding:calc(var(--nav-h) + 12px) var(--edge) 0; }
  .is-cover .hud-brand, .is-cover .hud-actions { display:none !important; }
  .is-embed .hud-brand, .is-embed .hud-actions { display:none !important; }   /* ?embed: in the Work floor's panel, under the site's own nav */
  .is-embed .bar { padding:14px 64px 0 16px; }   /* room for the panel's × */
  .is-hub .bar { padding:12px 16px 0; justify-content:flex-end; }   /* ?hub: inside the 719 Studios page, under its studio switch (JC 2026-10-19) */
  .is-hub .bar .title { display:none; }
